name: Build & Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Configure Gradle Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "kotlin.incremental=false" >> gradle.properties

      - name: Build WASM
        run: |
          chmod +x gradlew
          ./gradlew :themebuilder:wasmJsBrowserDistribution

      - name: List Build Output
        run: |
          ls -la themebuilder/build/dist/wasmJs/productionExecutable/

      - name: Configure Cloudflare Headers
        run: |
          cat > themebuilder/build/dist/wasmJs/productionExecutable/_headers << EOF
          *.wasm
            Content-Type: application/wasm

          *.js
            Content-Type: application/javascript
          EOF

          echo "--- _headers content ---"
          cat themebuilder/build/dist/wasmJs/productionExecutable/_headers
          echo "--- end ---"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy themebuilder/build/dist/wasmJs/productionExecutable --project-name=kore --commit-dirty=true