# .github/workflows/deploy.yml
name: Build & Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set Kotlin daemon memory
        run: echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Build WASM
        run: chmod +x gradlew && ./gradlew :themebuilder:wasmJsBrowserDistribution
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"

      - name: Add WASM MIME header
        run: |
          echo '/*.wasm
            Content-Type: application/wasm' > themebuilder/build/dist/wasmJs/productionExecutable/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy themebuilder/build/dist/wasmJs/productionExecutable --project-name=YOUR_PROJECT_NAME
