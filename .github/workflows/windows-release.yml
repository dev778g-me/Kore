name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Tag'
        required: true
        default: 'v1.0.0-alpha01'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build Windows Packages
        run: ./gradlew :themebuilder:packageMsi :themebuilder:packageExe

      - name: Verify Build Output
        run: Get-ChildItem -Path . -Include *.msi, *.exe -Recurse

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: ${{ github.event.inputs.version }}
          files: |
            themebuilder/build/compose/binaries/main/**/*.msi
            themebuilder/build/compose/binaries/main/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}